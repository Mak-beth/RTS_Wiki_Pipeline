[package]
name    = "threaded_pipeline"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "threaded_pipeline"
path = "src/main.rs"

[dependencies]
rts_core           = { path = "../rts_core" }
reqwest            = { version = "0.12", features = ["blocking"] }
